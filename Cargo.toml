[workspace]
resolver = "2"
members = ["crates/bf-core", "crates/bf-device",
    "crates/bf-decode", "crates/bf-io", "crates/bf-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZeroMips/blinkfeuer"
rust-version = "1.80"

[profile.release]
debug = 1
lto = "thin"

[profile.dev]
opt-level = 1
